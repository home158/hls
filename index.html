<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>ABC</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="streams.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000;
            overflow-x: hidden;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1px;
            width: 100vw;
        }
        video {
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            background: #000;
            display: block;
        }
    </style>
</head>
<body>
    <div class="grid" id="container"></div>

    <script>
        const container = document.getElementById('container');

        if (typeof streamUrls !== 'undefined' && Array.isArray(streamUrls)) {
            streamUrls.forEach(item => {
                const url = typeof item === 'string' ? item : item.url;
                if (!url) return;

                const video = document.createElement('video');
                video.controls = true;
                video.autoplay = true;
                video.muted = true;
                container.appendChild(video);

                if (Hls.isSupported()) {
                    const hls = new Hls();
                    hls.loadSource(url);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = url;
                    video.addEventListener('loadedmetadata', () => video.play());
                }
            });
        }
    </script>
</body>
</html>
